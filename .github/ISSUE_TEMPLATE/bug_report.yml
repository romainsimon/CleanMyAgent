name: Bug report
description: Report reproducible incorrect behavior in CleanMyAgent.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve CleanMyAgent. Do not attach private prompts, source code, credentials, or session files.
  - type: input
    id: version
    attributes:
      label: CleanMyAgent version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.6
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Storage attribution
        - Worktree audit or cleanup
        - Memory monitoring
        - Usage charts
        - Speedometer
        - Agent detection
        - Application UI
        - Build or packaging
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private prompts, source code, credentials, usernames, and repository paths.
          required: true
