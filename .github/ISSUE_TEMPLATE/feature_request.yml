name: Feature request
description: Propose a focused capability or agent adapter.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What maintenance or observability problem should CleanMyAgent solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Local evidence source
      description: For an adapter or metric, identify the documented local file, database, command, or process source and known versions.
  - type: textarea
    id: safety
    attributes:
      label: Safety and privacy considerations
      description: Explain protected states, failure behavior, and any content that must never be collected.
